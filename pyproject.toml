[project]
name = "tree-of-thoughts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mr.Quantum_1915", email = "darshanpatelgdh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "backoff>=2.2.1",
    "numpy>=2.5.3",
    "openai>=3.19.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sympy>=1.14.0",
]

[project.scripts]
tree-of-thoughts = "tot:main"

[tool.uv.build-backend]
module-name = "tot"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
